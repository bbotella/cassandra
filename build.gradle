plugins {
    id 'base' // Applying base plugin for standard lifecycle tasks
}

group = 'org.apache.cassandra'
version = '5.1'

// You can add a description if you like, for example:
description = 'Apache Cassandra'

// Add a wrapper task to ensure the correct Gradle version is used.
// This is usually not strictly necessary if you always use ./gradlew but can be good practice.
wrapper {
    gradleVersion = '8.7' // Matches the version set during initialization
    distributionType = Wrapper.DistributionType.ALL // Optional: for IDEs to have sources
}

// Modified helper function to create prefixed Ant task wrappers
// antTargetName is the name of the Ant target (e.g. "build")
// gradleTaskName is the desired Gradle task name (e.g. "antBuild")
def antTask(String antTargetName, String gradleTaskName, String descriptionText) {
    tasks.register(gradleTaskName) {
        description = descriptionText
        group = 'Ant Tasks' // Group these tasks together in `gradle tasks` output
        doLast {
            exec {
                commandLine 'ant', antTargetName
            }
        }
    }
}

// Create Gradle tasks that wrap Ant targets, using prefixed names
antTask('build', 'antBuild', 'Compiles the main Cassandra classes by calling Ant.')
antTask('clean', 'antClean', 'Removes all locally created artifacts by calling Ant.')
antTask('jar', 'antJar', 'Assembles Cassandra JAR files by calling Ant.')
antTask('check', 'antCheck', 'Verifies source code and dependencies by calling Ant (runs RAT, Checkstyle, etc.).')
antTask('artifacts', 'antArtifacts', 'Creates Cassandra tarball and Maven artifacts by calling Ant.')

// Add Gradle tasks for various Ant test targets, using prefixed names
antTask('test', 'antTest', 'Runs the main Ant unit test target.')
antTask('testsome', 'antTestsome', 'Runs specific Ant unit tests. Pass test names via project properties, e.g., -Ptest.name=YourTestClass.')
antTask('long-test', 'antLongTest', 'Runs long-running Ant tests.')
antTask('burn-test', 'antBurnTest', 'Runs Ant burn tests.')
antTask('cql-test', 'antCqlTest', 'Runs Ant CQL tests.')
antTask('stress-test', 'antStressTest', 'Runs Ant stress tests. Ensure stress tool is built (e.g., via "ant stress-build" or a wrapped task).')
antTask('fqltool-test', 'antFqltoolTest', 'Runs Ant fqltool tests. Ensure fqltool is built (e.g., via "ant fqltool-build" or a wrapped task).')
antTask('test-jvm-dtest', 'antTestJvmDtest', 'Runs Ant in-JVM distributed tests (dtests).')

// Add Gradle tasks for IDE integration file generation, using prefixed names
antTask('generate-idea-files', 'antGenerateIdeaFiles', 'Generates IntelliJ IDEA project files by calling Ant.')
antTask('generate-eclipse-files', 'antGenerateEclipseFiles', 'Generates Eclipse project files by calling Ant.')

// Add a general purpose Gradle task to run any Ant target
tasks.register('antTarget') {
    description = "Runs an arbitrary Ant target specified by the 'antTargetName' project property (e.g., ./gradlew antTarget -PantTargetName=yourAntTarget)."
    group = 'Ant Tasks'
    doLast {
        if (project.hasProperty('antTargetName')) {
            def targetName = project.property('antTargetName')
            logger.lifecycle("Executing Ant target: ${targetName}...")
            exec {
                commandLine 'ant', targetName
            }
        } else {
            logger.warn("No Ant target specified. Use -PantTargetName=<target> to specify an Ant target.")
            logger.warn("Example: ./gradlew antTarget -PantTargetName=javadoc")
        }
    }
}
